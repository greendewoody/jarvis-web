<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00ffff;
            --bg: #050505;
            --grid: rgba(0, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--cyan);
            background: linear-gradient(180deg, rgba(0,255,255,0.1) 0%, transparent 100%);
            z-index: 10;
        }
        .logo { font-size: 20px; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--cyan); }
        .dot { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); animation: pulse 1s infinite alternate; }

        /* Главный экран */
        .core {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
        }

        /* Реактор с анимацией */
        .reactor-container {
            height: 200px; width: 100%;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .reactor {
            width: 140px; height: 140px; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Кольца */
        .ring {
            position: absolute; border-radius: 50%;
            border: 1px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0,255,255,0.2) inset;
        }
        .ring-outer {
            width: 100%; height: 100%;
            border-style: dashed;
            animation: spin 20s linear infinite;
            opacity: 0.6;
        }
        .ring-middle {
            width: 75%; height: 75%;
            border-width: 2px;
            border-color: transparent;
            border-top-color: var(--cyan);
            border-bottom-color: var(--cyan);
            animation: spin-reverse 8s linear infinite;
        }
        .ring-inner {
            width: 50%; height: 50%;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 30px rgba(0,255,255,0.6), inset 0 0 20px rgba(0,255,255,0.4);
            animation: pulse 2s infinite alternate;
        }
        
        /* Ядро */
        .core-dot {
            width: 25px; height: 25px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--cyan);
            z-index: 2;
        }

        /* Чат */
        #chat {
            width: 100%; max-width: 800px;
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 5;
        }
        .msg {
            padding: 12px 16px; border-radius: 4px; max-width: 85%;
            line-height: 1.5; font-size: 15px;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease-out;
        }
        .msg.user {
            align-self: flex-end; background: rgba(0, 255, 255, 0.15);
            border-right: 3px solid var(--cyan); color: #ffffff;
        }
        .msg.jarvis {
            align-self: flex-start; background: transparent;
            border-left: 3px solid var(--cyan); color: var(--cyan);
            text-shadow: 0 0 5px rgba(0,255,255,0.3);
        }

        /* Поле ввода */
        .input-area {
            display: flex; gap: 10px; padding: 15px 20px;
            background: rgba(0,0,0,0.9); border-top: 1px solid var(--cyan);
            z-index: 20;
        }
        input {
            flex: 1; background: rgba(0, 255, 255, 0.05);
            border: 1px solid var(--cyan); color: #ffffff;
            padding: 12px 15px; font-family: 'Share Tech Mono', monospace; font-size: 16px;
            outline: none; border-radius: 4px; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0,255,255,0.4); background: rgba(0, 255, 255, 0.1); }
        button {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            padding: 0 15px; font-size: 18px; cursor: pointer;
            border-radius: 4px; transition: 0.3s;
        }
        button:active { background: var(--cyan); color: #000000; box-shadow: 0 0 20px var(--cyan); }

        /* Анимации */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { from { opacity: 0.6; transform: scale(0.95); } to { opacity: 1; transform: scale(1.05); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .reactor-container { height: 150px; }
            .reactor { width: 110px; height: 110px; }
            .core-dot { width: 20px; height: 20px; }
            header { padding: 10px 15px; }
            .logo { font-size: 16px; }
            .input-area { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">J.A.R.V.I.S</div>
        <div class="status">
            <div class="dot"></div>
            <span>ONLINE</span>
        </div>
    </header>

    <div class="core">
        <div class="reactor-container">
            <div class="reactor">
                <div class="ring ring-outer"></div>
                <div class="ring ring-middle"></div>
                <div class="ring ring-inner"></div>
                <div class="core-dot"></div>
            </div>
        </div>

        <div id="chat">
            <div class="msg jarvis">&gt; Системы в норме. Я готов к работе, сэр.</div>
        </div>
    </div>

    <div class="input-area">
        <button id="mic-btn">🎤</button>
        <input id="user-input" type="text" placeholder="Введите команду..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const API_URL = 'https://jarvis-bot-0k1j.onrender.com/api/chat';
        
        let webHistory = [];
        let globalAudio = new Audio();

        function addMessage(text, isUser, audioBase64 = null) {
            const div = document.createElement('div');
            div.className = isUser ? 'msg user' : 'msg jarvis';
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

            if (!isUser && audioBase64) {
                globalAudio.src = `data:audio/mp3;base64,${audioBase64}`;
                globalAudio.play().catch(e => console.log('Аудио заблокировано:', e));
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';
            
            const loading = document.createElement('div');
            loading.className = 'msg jarvis';
            loading.textContent = '...';
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: webHistory })
                });
                const data = await res.json();
                
                chat.removeChild(loading);
                addMessage(data.response, false, data.audio);

                webHistory.push({ role: 'user', content: text });
                webHistory.push({ role: 'assistant', content: data.response });
                if (webHistory.length > 10) webHistory.splice(0, 2);
                
            } catch (e) {
                chat.removeChild(loading);
                addMessage('Связь с сервером потеряна.', false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.onstart = () => { micBtn.style.background = 'var(--cyan)'; micBtn.style.color = '#000'; };
            recognition.onend = () => { micBtn.style.background = 'transparent'; micBtn.style.color = 'var(--cyan)'; };
            recognition.onresult = (e) => {
                input.value = e.results[0][0].transcript;
                sendMessage();
            };
            micBtn.addEventListener('click', () => recognition.start());
        } else {
            micBtn.style.display = 'none';
        }
    </script>
</body>
</html>
